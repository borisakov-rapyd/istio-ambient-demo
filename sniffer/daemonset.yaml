# Wire sniffer — GitOps-managed plaintext/HBONE proof for the demo.
# hostNetwork + privileged so it sees the NODE's traffic (not the pod's).
# Runs on every node (DaemonSet) so it covers wherever checkout/payment land.
# DEMO ONLY — never ship a privileged host-network sniffer to a real cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: sniffer
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wire-sniffer
  namespace: sniffer
  labels:
    app: wire-sniffer
spec:
  selector:
    matchLabels:
      app: wire-sniffer
  template:
    metadata:
      labels:
        app: wire-sniffer
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists          # run on every node incl. control-plane
      containers:
        - name: tcpdump
          image: nicolaka/netshoot:v0.13   # pre-pull before the demo
          env:
            - name: IFACE
              value: ""          # empty = auto-detect the inter-node NIC; override if needed
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "================ wire-sniffer ================"
              echo "interfaces on this node:"
              ip -o -brief link | awk '{print "  " $1 " " $2}'
              # Capture the INTER-NODE interface only (the default-route device), NOT 'any'.
              # On 'any' you also see the local ztunnel->app delivery leg, which is always
              # plaintext. On the node NIC you see what actually crosses the wire between
              # pods: plaintext :8080 before the mesh, encrypted HBONE :15008 after.
              IFACE="${IFACE:-$(ip route | awk '/default/ {print $5; exit}')}"
              echo "capturing on: ${IFACE}   (override with the IFACE env var)"
              echo "readable HTTP = plaintext on the wire."
              echo ">>> the stream goes SILENT once traffic is HBONE-encrypted <<<"
              echo "============================================="
              # grep keeps only HTTP request/response lines — no ACK/header noise, and
              # nothing matches once the payload is TLS, so the screen simply stops.
              # tcpdump -l line-buffers its own output; busybox grep streams it fine
              # (no GNU --line-buffered flag available).
              tcpdump -i "${IFACE}" -A -l -n -s 400 'tcp port 8080 or tcp port 15008' 2>/dev/null \
                | grep -E '(GET|POST|PUT|DELETE|PATCH) /|Host: |HTTP/1'
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
