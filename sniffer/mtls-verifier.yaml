# STRICT-mTLS prover — an UNMESHED caller (sniffer namespace, not ambient-labeled)
# that curls payment in a loop and prints a clear line per call:
#   OK    ok  200   payment reachable      <- PERMISSIVE / STRICT off
#   FAIL  reset/timeout                    <- STRICT enforced: unmeshed caller blocked
# Watch: kubectl -n sniffer logs -f deploy/mtls-verifier
# The stream flips from OK to FAIL the moment you enable strictMtls on payment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtls-verifier
  namespace: sniffer
  labels:
    app: mtls-verifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtls-verifier
  template:
    metadata:
      labels:
        app: mtls-verifier
    spec:
      containers:
        - name: verifier
          image: curlimages/curl:8.11.1
          env:
            - name: TARGET
              value: "http://payment.payment.svc.cluster.local/api/charge"
            - name: INTERVAL
              value: "2"
          command: ["sh", "-c"]
          args:
            - |
              echo "mtls-verifier: unmeshed caller -> $TARGET"
              echo "OK while payment accepts plaintext; FAIL once STRICT mTLS is enforced"
              echo "-----------------------------------------------------------------"
              while true; do
                ts=$(date +%H:%M:%S)
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 "$TARGET" 2>/dev/null) || code=000
                if [ "$code" = "200" ]; then
                  echo "$ts  OK    reached payment (HTTP $code)"
                else
                  echo "$ts  FAIL  rejected — no mTLS identity (curl code/http: $code)"
                fi
                sleep "$INTERVAL"
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
